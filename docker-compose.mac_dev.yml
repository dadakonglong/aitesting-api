version: '3.8'

services:
  # ai-service 代表后端的 Python 核心业务逻辑
  ai-service:
    # 强制指定平台，确保在 Mac 上运行时，容器内部也模拟为 linux/amd64 环境
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile.mac_x86 # 使用刚才创建的适配 Mac 跨平台编译的 Dockerfile
    container_name: aitesting-dev-ai-service
    ports:
      - "8000:8000"
    environment:
      # 在此配置本地开发所需的环境变量
      - TZ=Asia/Shanghai
      # 如果有其他特定的配置项，例如 OPENAI_API_KEY，可以在这里添加或通过 .env 传递
    volumes:
      # 核心魔法：将宿主机当前目录(Mac上)的代码实时挂载到容器内的 /app 目录。
      # 这样在宿主机(Mac)上用 VSCode 或其他编辑器修改代码后，容器内会即时生效（配合 FastAPI 的 --reload）。
      - .:/app
    # 如果项目中还有其它依赖服务如 postgres, qdrant 等，可以在本文件继续扩展。
    # 这里专注于将主代码环境容器化并挂载。
    # networks:
    #   - aitesting-network

    # networks:
    #   aitesting-network:
    #     driver: bridge
